# Native Python deployment. The model is bundled; no dataset downloads.
services:
  - type: web
    name: altur-detector
    runtime: python
    plan: free
    region: virginia
    repo: https://github.com/ddiegocchavez/act-altur-
    branch: main
    buildCommand: pip install -r requirements.lock
    startCommand: python serve.py
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
